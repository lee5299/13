<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업무 정리 목업 · 작업 기록 확대</title>
<!--
  업무 정리 프로그램 — 디자인 검토용 목업 (가상 데이터)
  - 실제 Windows 동작·파일 접근·외부 서비스 연결 없음
  - 파일 열기/복사/연결/폴더 생성은 화면 아래 "목업 동작" 안내만 표시
  - 화면: ① 바탕화면 목록 + 작업 상세 창  ② 완료 작업 창
-->
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#E2E0DB}
body{font-family:'IBM Plex Sans KR','Malgun Gothic',system-ui,sans-serif;color:#1F2426;font-size:14px;line-height:1.5}
button,input,select{font-family:inherit;font-size:inherit}
button{cursor:pointer}
a{color:#2F5E5C}
:focus-visible{outline:2px solid #3D6B69;outline-offset:2px}
.scene{position:relative;min-height:100vh;display:flex;flex-direction:column}
.desk{flex-grow:1;display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start;padding:28px 32px 40px}
.icons{flex:0 0 76px;display:flex;flex-direction:column;gap:22px;align-items:center;padding-top:4px}
.dicon{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:#3A4245}
.widget{flex:999 1 640px;min-width:0;max-width:980px;background:rgba(250,250,248,.84);border:1px solid rgba(31,36,38,.07);border-radius:14px;padding:22px 24px 16px;display:flex;flex-direction:column;gap:16px}
.hdr{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.col{display:flex;flex-direction:column}
.eyebrow{font-size:12px;color:#5B6467}
h1{margin:0;font-size:26px;font-weight:600;letter-spacing:-.01em}
h2{margin:0;font-weight:600}
h3{margin:0;font-size:14px;font-weight:600}
.sub{font-size:14px;color:#4A5356}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{height:40px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;border:1px solid #CFD2CE;border-radius:8px;background:#fff;color:#2B3234;text-decoration:none;white-space:nowrap;font-size:14px}
.btn.primary{background:#3D6B69;border-color:#3D6B69;color:#fff;font-weight:500}
.btn.outline{border-color:#3D6B69;color:#2F5E5C;font-weight:500}
.btn.sm{height:34px;padding:0 10px;font-size:13px;border-radius:7px}
.btn.xs{height:30px;padding:0 10px;font-size:12.5px;border-radius:6px}
.btn.on{background:#3D6B69;border-color:#3D6B69;color:#fff}
.btn.soft-on{background:#E9F1F0;border-color:#A9C6C3;color:#24504E}
.link{border:none;background:none;padding:4px 0;color:#2F5E5C;font-size:12.5px;display:inline-flex;align-items:center;gap:2px;text-decoration:none}
.tag{font-size:11.5px;padding:0 6px;border-radius:4px;white-space:nowrap;flex-shrink:0;font-weight:400}
.t-hi{color:#8E3427;background:#F6E6E2}.t-rep{color:#2F5E5C;background:#E4EEED}.t-wait{color:#4A5255;background:#ECECE8}
.t-approx{color:#6E5210;border:1px dashed #B89A50}.t-exact{color:#2F5E5C;background:#E4EEED}.t-past{color:#4A5255;border:1px dotted #8C9497}.t-est{color:#6E5210;background:#F4EDDA}
.card{background:#fff;border:1px solid #E3E2DE;border-radius:10px;padding:12px 14px 10px;display:flex;flex-direction:column;gap:4px}
.card-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px;padding-bottom:2px}
.card-h h2{font-size:15px}
.meta{font-size:12px;color:#5B6467}
.search{flex:1 1 300px;min-width:0;height:40px;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;border:1px solid #C9CCC8;border-radius:8px;background:#fff;color:#5B6467}
.search input{flex-grow:1;min-width:0;height:34px;border:none;outline:none;background:transparent;color:#1F2426}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.scroll{overflow-x:auto}
.grid-row{width:100%;text-align:left;display:grid;gap:10px;align-items:center;border:none;border-bottom:1px solid #F0EFEB;background:transparent;color:#1F2426;font-size:13.5px;min-height:36px;padding:var(--pad)}
.grid-row:hover{background:#F6F6F3}
.grid-head{display:grid;gap:10px;padding:0 12px 4px;font-size:12px;color:#5B6467;border-bottom:1px solid #ECEBE7}
.g-task{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) 62px 62px 48px;min-width:560px}
.g-month{grid-template-columns:92px 120px minmax(0,1fr)}
.g-done{grid-template-columns:52px minmax(0,1.2fr) minmax(0,1fr) 52px 48px;min-width:540px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{font-variant-numeric:tabular-nums}
.r{text-align:right}
.grid-row.sel,.grid-row.sel:hover{background:#E9F1F0;box-shadow:inset 3px 0 0 #3D6B69}
.namecell{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap}
.info{margin-top:6px;padding:7px 12px;border-radius:7px;background:#F4F4F1;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12.5px;color:#3A4245}
.foot{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:#5B6467}
.win{background:#FBFBFA;border:1px solid rgba(31,36,38,.16);border-radius:10px;box-shadow:0 18px 44px rgba(31,36,38,.18),0 2px 6px rgba(31,36,38,.08);overflow:hidden;display:flex;flex-direction:column}
.detail{flex:1 1 500px;max-width:600px;min-width:0;position:relative;z-index:2;align-self:flex-start}
@media(min-width:1180px){.detail{margin-left:-56px;margin-top:64px}}
.tbar{height:38px;display:flex;align-items:center;justify-content:space-between;padding-left:14px;background:#F1F1EE;border-bottom:1px solid #E3E2DE;font-size:12.5px;color:#3A4245}
.tbtn{width:44px;height:38px;border:none;background:none;color:#3A4245;display:inline-flex;align-items:center;justify-content:center}
.wbody{padding:18px 22px 20px;display:flex;flex-direction:column;gap:16px}
.metas{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));border:1px solid #E3E2DE;border-radius:8px;background:#fff}
.metas>div{padding:8px 12px;display:flex;flex-direction:column;border-right:1px solid #EFEEEA}
.metas>div:last-child{border-right:none}
.metas .k{font-size:11.5px;color:#5B6467}
.metas .v{font-weight:500;font-variant-numeric:tabular-nums}
.box{padding:10px 14px;border-radius:8px;background:#F2F2EF;font-size:13.5px;margin:0}
.dl{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 12px}
.dl .k{color:#5B6467}
pre.rec{margin:0;padding:10px 14px;border-radius:8px;background:#F2F2EF;font-family:Consolas,'D2Coding',ui-monospace,monospace;font-size:12.5px;line-height:1.6;white-space:pre-wrap;color:#2B3234}
.sec{display:flex;flex-direction:column;gap:6px}
.rowbar{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px}
.subrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 12px;border:1px solid #D6DAD7;border-radius:8px;background:#fff}
.ficon{width:34px;height:34px;border-radius:7px;background:#E4EEED;color:#2F5E5C;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.thumb{width:112px;display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:#4F585B;word-break:break-all}
.thumb>div{height:64px;border-radius:6px;background:#ECECE8;display:flex;align-items:center;justify-content:center;color:#7B8487}
.drop{flex:1 1 180px;min-height:64px;border:1px dashed #B9BEBB;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;font-size:12px;color:#4F585B;text-align:center}
.taskbar{height:48px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;background:rgba(243,242,239,.96);border-top:1px solid #D6D4CF}
.overlay{position:absolute;top:0;left:0;right:0;bottom:0;z-index:20;background:rgba(28,34,36,.30);display:flex;justify-content:center;align-items:flex-start;padding:48px 16px}
.toast{position:fixed;left:16px;right:16px;bottom:64px;z-index:40;display:flex;justify-content:center;pointer-events:none}
.toast>div{pointer-events:auto;max-width:640px;display:flex;gap:10px;align-items:center;padding:10px 8px 10px 14px;border-radius:8px;background:#2B3234;color:#F4F4F1;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast .lbl{font-size:11.5px;padding:1px 6px;border-radius:4px;background:#4A5356;flex-shrink:0}
.toast .tbtn{width:32px;height:32px;color:#F4F4F1}
.seg{display:flex;flex-wrap:wrap;border:1px solid #CFD2CE;border-radius:8px;overflow:hidden}
.seg button{height:36px;padding:0 12px;border:none;border-right:1px solid #E3E2DE;background:#fff;color:#2B3234;font-size:13px}
.seg button:last-child{border-right:none}
.seg button.on{background:#3D6B69;color:#fff}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:#3A4245}
.f input,.f select{height:40px;padding:0 10px;border:1px solid #C9CCC8;border-radius:7px;background:#fff;color:#1F2426;font-size:14px}
.hint{color:#5B6467}
.opts{position:fixed;left:12px;bottom:60px;z-index:30;background:#fff;border:1px solid #CFD2CE;border-radius:8px;padding:8px 10px;font-size:12px;display:flex;flex-direction:column;gap:4px;box-shadow:0 4px 12px rgba(0,0,0,.08);color:#3A4245}
.opts b{font-weight:600}
.month-card{min-height:96px;padding:8px 10px;border:1px solid #E3E2DE;border-radius:8px;background:#fff;display:flex;flex-direction:column;gap:5px}
.month-card.now{border-color:#3D6B69}
.chip{text-align:left;padding:3px 7px;border-radius:5px;font-size:12px}
.chip.exact{border:1px solid #9DBDBA;background:#E4EEED;color:#24504E}
.chip.approx{border:1px dashed #B89A50;background:#FBF7EC;color:#5E460C}
.chip.past{border:1px dotted #8C9497;background:#fff;color:#3A4245}
.chip.on{box-shadow:0 0 0 2px #3D6B69}
.round{width:100%;text-align:left;min-height:44px;padding:6px 12px;border:1px solid #E3E2DE;border-radius:8px;background:#fff;color:#1F2426;display:flex;flex-direction:column}
.round.on{background:#E9F1F0;border-color:#A9C6C3}
.chk{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid #F0EFEB;font-size:13.5px}
.chk:last-child{border-bottom:none}

/* 작업 기록 중심 상세 창. 가상 UI이며 실제 파일 내용/Windows 창은 다루지 않음. */
.detail{position:fixed;top:68px;right:24px;bottom:76px;width:min(1120px,calc(100vw - 160px));max-width:none;max-height:960px;min-height:440px;margin:0!important;z-index:10;align-self:auto}
.detail .tbar{flex:0 0 38px;user-select:none}
.tbtn[data-act="toggleDetailMax"]:hover{background:#DFE6E3}
.detail .wbody{flex:1;min-height:0;padding:14px 18px 12px;gap:10px;overflow:hidden}
.detail-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;flex-shrink:0}
.detail-heading .detail-title{font-size:21px}
.detail-heading .detail-path{max-width:560px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail .metas{grid-template-columns:repeat(5,minmax(0,1fr));flex-shrink:0}
.detail .metas>div{padding:6px 10px}
.detail-workspace{display:grid;grid-template-columns:minmax(0,1fr) 304px;gap:16px;flex:1;min-height:0}
.record-pane{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.record-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0;min-height:30px}
.record-head h3{font-size:15px}
.record-capacity{font-size:12px;color:#2F5E5C;background:#E9F1F0;border-radius:5px;padding:3px 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.record-scroll{flex:1;min-height:0;overflow:auto;border:1px solid #D6DAD7;border-radius:8px;background:#F7F7F4;scrollbar-gutter:stable}
.record-sheet{display:grid;grid-template-columns:42px minmax(max-content,1fr);min-width:100%;width:max-content;min-height:100%}
.record-gutter,.record-text{margin:0;font-family:Consolas,'D2Coding','Malgun Gothic',monospace;font-size:13px;line-height:20px;tab-size:4;white-space:pre}
.record-gutter{padding:12px 8px 12px 0;text-align:right;color:#8A9290;background:#F0F1ED;border-right:1px solid #E2E5DF;user-select:none}
.record-text{padding:12px 16px;color:#2B3234;border:0;background:none;border-radius:0}
.record-note{font-size:11.5px;color:#5B6467;flex-shrink:0}
.detail-sidebar{min-width:0;min-height:0;overflow:auto;padding-right:4px;display:flex;flex-direction:column;gap:16px;scrollbar-gutter:stable}
.detail-sidebar .dl{grid-template-columns:76px minmax(0,1fr);gap:5px 9px}
.detail-sidebar .box{padding:10px 12px;font-size:12.5px}
.detail-sidebar .subrow{padding:9px;gap:8px}
.detail-sidebar .ficon{width:28px;height:30px}
.detail-sidebar .subrow>.col{flex-basis:180px!important}
.detail-sidebar .subrow>span:last-child{margin-left:auto}
.detail-sidebar .thumb{width:100px}
.detail-sidebar .thumb>div{height:54px}
.capture-section{padding-top:12px;border-top:1px dashed #BEC5C1}
.detail-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0;border-top:1px solid #E3E2DE;padding-top:8px;min-height:44px}
.detail.maximized{inset:0 0 48px 0;width:100%;height:auto;max-height:none;min-height:0;border-radius:0;z-index:15}
.detail.maximized .detail-workspace{grid-template-columns:minmax(0,1fr) 330px;gap:20px}
.detail.maximized>.wbody>.detail-heading,.detail.maximized>.wbody>.metas,.detail.maximized .record-pane>.rowbar{display:none}
.max-summary{display:none}
.detail.maximized .max-summary{display:flex;flex-direction:column;gap:8px;padding-bottom:12px;border-bottom:1px solid #E3E2DE}
.max-summary .summary-values{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:12.5px}
.max-summary .summary-values>span{display:flex;flex-direction:column;gap:2px}
.detail.maximized .record-text,.detail.maximized .record-gutter{font-size:14px;line-height:20px}
.detail-is-max{overflow:hidden}
.detail-is-max .opts{display:none}
@media (max-height:950px){
 .detail.maximized .record-text,.detail.maximized .record-gutter{font-size:13px;line-height:18px}
 .detail.maximized .wbody{padding:10px 16px;gap:8px}
 .detail.maximized .detail-heading{min-height:38px}
 .detail.maximized .detail-footer{min-height:40px;padding-top:5px}
}
@media (max-width:1000px){
 .detail{width:calc(100vw - 48px)}
 .detail-workspace,.detail.maximized .detail-workspace{grid-template-columns:minmax(0,1fr) 272px;gap:12px}
 .detail-heading{flex-wrap:wrap}
 .detail .metas .k{font-size:10.5px}
 .detail-sidebar .dl{grid-template-columns:66px minmax(0,1fr)}
}
@media (max-width:700px){
 .detail{inset:12px 12px 60px;width:auto;min-height:0}
 .detail .wbody{overflow:auto}
 .detail-workspace,.detail.maximized .detail-workspace{display:flex;flex-direction:column;flex:none;min-height:0}
 .record-pane{height:65vh;min-height:360px;flex-shrink:0}
 .detail-sidebar{overflow:visible;min-height:auto;flex-shrink:0}
 .detail .metas{grid-template-columns:repeat(3,minmax(0,1fr))}
 .detail-heading .detail-path{max-width:calc(100vw - 90px)}
 .detail-footer{flex-wrap:wrap}
 .record-note{max-width:220px}
}

</style>
</head>

        '<span style="display:flex;align-items:center;gap:5px"><span style="width:14px;height:10px;border-radius:3px;border:1px dashed #B89A50"></span>대략적 시기(예상)</span>' +
        '<span style="display:flex;align-items:center;gap:5px"><span style="width:14px;height:10px;border-radius:3px;border:1px dotted #8C9497"></span>지난 주기 기록만 있음</span></span></div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start">' +
        '<div style="flex:3 1 480px;min-width:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px">' + cards + '</div>' +
        '<div style="flex:1 1 240px;min-width:0;padding:14px;border:1px solid #E3E2DE;border-radius:8px;background:#fff;display:flex;flex-direction:column;gap:8px"><span class="meta">' + yd.kind + '</span><h2 style="font-size:18px">' + yd.title + '</h2>' +
          yd.lines.map(function (l) { return '<span style="font-size:13.5px;color:#2B3234;padding-left:10px;border-left:2px solid #E3E2DE">' + l + '</span>'; }).join('') +
          (yd.register ? '<button class="btn sm" style="align-self:flex-start;margin-top:4px" data-act="msg" data-arg="register">반복업무로 직접 등록…</button>' : '') +
        '</div></div>' +
    '</div></div></div>';
}

/* ---------- ② 완료 작업 창 ---------- */
function vDone() {
  var q = S.dq.trim().toLowerCase();
  var pd = PERIODS.filter(function (p) { return p[0] === S.period; })[0] || PERIODS[4];
  var list = DONE.filter(function (d) { return pd[2](d) && (!q || [d.folder, d.what, d.who].some(function (x) { return x.toLowerCase().indexOf(q) !== -1; })); });
  var sum = function (xs) { return xs.reduce(function (a, d) { return a + num(d.est); }, 0); };
  var keyOf = function (d) { return S.group === 'week' ? d.week : d.month; };
  var keys = [];
  list.forEach(function (d) { if (keys.indexOf(keyOf(d)) === -1) keys.push(keyOf(d)); });
  var rows = keys.map(function (k) {
    var items = list.filter(function (d) { return keyOf(d) === k; });
    return '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:12px 12px 4px;border-bottom:1px solid #ECEBE7;min-width:540px"><span style="font-size:13px;font-weight:600;color:#2B3234">' + k + '</span><span class="meta">' + items.length + '건 · 예상량 합계 ' + sum(items) + '일</span></div>' +
      items.map(function (d) {
        var on = S.sel === d.id;
        return '<button class="grid-row g-done' + (on ? ' sel' : '') + '" style="padding:7px 12px" aria-pressed="' + on + '" data-act="selDone" data-arg="' + d.id + '" title="' + esc(d.done + ' 완료 · ' + d.folder + ' — ' + d.what) + '">' +
          '<span class="num" style="color:#3A4245">' + d.done + '</span>' +
          '<span class="namecell"><span class="ell" style="font-weight:500">' + d.folder + '</span>' + (d.rep ? '<span class="tag t-rep" style="font-size:11px">반복</span>' : '') + '</span>' +
          '<span class="ell" style="color:#4A5356">' + d.what + '</span><span class="num" style="color:#4A5356">' + d.req + '</span><span class="num r" style="color:#3A4245">' + d.est + '</span></button>';
      }).join('');
  }).join('') || '<span class="meta" style="display:block;padding:14px 12px;font-size:13px">해당하는 완료 작업이 없습니다</span>';

  var sel = DONE.filter(function (d) { return d.id === S.sel; })[0];
  var side = sel ?
    '<div class="col" style="gap:2px"><span class="meta">' + sel.done + ' 완료 · 완료 폴더</span><h2 style="font-size:17px;word-break:break-all">' + sel.folder + '</h2></div>' +
    '<div class="box dl" style="grid-template-columns:88px minmax(0,1fr);font-size:13px"><span class="k">요청일</span><span class="num">' + sel.req + '</span><span class="k">누가</span><span>' + sel.who + '</span><span class="k">무엇을</span><span>' + sel.what + '</span><span class="k">왜(요청이유)</span><span>' + sel.why + '</span><span class="k">예상 작업량</span><span>' + sel.est + '</span></div>' +
    '<div class="sec"><h3 style="font-size:13.5px">결과물</h3>' + sel.results.map(function (r, i) {
      return '<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid #D6DAD7;border-radius:7px;font-size:13px"><span style="color:#2F5E5C;display:flex">' + ic('file', 15) + '</span><span style="flex-grow:1;min-width:0;word-break:break-all">' + r + '</span><button class="btn xs" data-act="openResult" data-arg="' + i + '">열기</button></div>';
    }).join('') + '</div>' +
    '<div style="display:flex;flex-wrap:wrap;gap:6px"><button class="btn sm" data-act="msg" data-arg="doneFolder">폴더 열기</button><button class="btn sm" data-act="msg" data-arg="record">기록 열기 (메모장)</button></div>' +
    '<span class="meta">파일 내용 자동 열람 꺼짐 · 내용 표시 범위 확인 중(예시)</span>'
    : '<div style="min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;color:#5B6467;font-size:13px">' + ic('check', 22, 1.6) + '<span>목록에서 작업을 누르면<br>요청 내용과 결과물이 여기에 표시됩니다</span></div>';

  return '<div style="flex-grow:1;padding:32px 32px 40px;display:flex;justify-content:center;align-items:flex-start">' +
    '<section class="win" aria-label="완료 작업 창" style="width:100%;max-width:1180px">' + titlebar('완료 작업 — 업무 정리', 'toMain', true) +
    '<div style="padding:18px 22px 22px;display:flex;flex-direction:column;gap:14px">' +
      '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between"><div class="col" style="gap:2px">' +
        '<a href="#" class="link" style="font-size:12.5px" data-act="toMain">' + ic('back', 13, 2) + '바탕화면 목록으로</a><h1 style="font-size:22px">완료 작업</h1>' +
        '<span style="font-size:13px;color:#4A5356">' + pd[1] + ' · ' + list.length + '건 · 등록 예상량 합계 ' + sum(list) + '일' + (q ? ' · 검색 중' : '') + ' · 완료 폴더 기준</span></div>' +
        '<button class="btn" style="height:38px;font-size:13.5px" data-act="copyList">' + ic('copy', 15) + '목록 복사</button></div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">' +
        '<label class="search" style="flex:1 1 260px;height:38px">' + ic('search', 16, 1.8) + '<span class="sr">완료 작업 검색</span><input id="q-done" data-input="dq" value="' + esc(S.dq) + '" placeholder="완료 작업 검색 · 폴더명, 요청 내용, 요청자"></label>' +
        '<div class="seg" role="group" aria-label="기간">' + PERIODS.map(function (p) { return '<button class="' + (p[0] === pd[0] ? 'on' : '') + '" aria-pressed="' + (p[0] === pd[0]) + '" data-act="period" data-arg="' + p[0] + '">' + p[1] + '</button>'; }).join('') + '</div>' +
        '<div role="group" aria-label="묶음" style="display:flex;align-items:center;gap:4px"><span style="font-size:12.5px;color:#5B6467;margin-right:2px">묶음</span>' +
          [['week', '주별'], ['month', '월별']].map(function (g) { return '<button class="btn sm' + (S.group === g[0] ? ' soft-on' : '') + '" aria-pressed="' + (S.group === g[0]) + '" data-act="group" data-arg="' + g[0] + '">' + g[1] + '</button>'; }).join('') + '</div>' +
      '</div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start">' +
        '<div style="flex:3 1 560px;min-width:0;background:#fff;border:1px solid #E3E2DE;border-radius:10px;padding:6px 14px 10px;overflow-x:auto">' +
          '<div class="grid-head g-done" style="padding:6px 12px"><span>완료일</span><span>작업 폴더</span><span>요청 내용</span><span>요청일</span><span class="r">예상량</span></div>' + rows + '</div>' +
        '<aside aria-label="선택한 완료 작업" style="flex:1 1 300px;min-width:0;background:#fff;border:1px solid #E3E2DE;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px">' + side + '</aside>' +
      '</div>' +
    '</div></section></div>';
}

/* ---------- 동작 ---------- */
var MSG = {
  folder: '폴더 열기 — 실제 프로그램에서는 탐색기로 엽니다. 목업이라 열지 않았습니다.',
  doneFolder: '완료 폴더 열기 — 목업이라 탐색기를 열지 않았습니다.',
  record: '기록 열기 — 실제 프로그램에서는 메모장이나 Notepad++로 엽니다. 목업이라 열지 않았습니다.',
  cancel: '취소 상태로 바꾸는 메뉴 자리입니다. 목업에서는 상태를 바꾸지 않았습니다.',
  register: '반복업무 등록 창은 아직 그리지 않았습니다. 사람이 직접 등록하는 흐름입니다.'
};
var ACT = {
  screen: function (a) { S.detailMax = false; S.screen = a; S.overlay = null; S.notice = null; render(); window.scrollTo(0, 0); },
  toMain: function () { ACT.screen('main'); },
  overlay: function (a) { S.overlay = a; if (a === 'past') S.pastRound = '2026-02'; render(); },
  closeOverlay: function () { S.overlay = null; render(); },
  closeDetail: function () { S.open = null; S.detailMax = false; render(); },
  toggleDetailMax: function () { S.detailMax = !S.detailMax; render(); },
  clearNotice: function () { S.notice = null; render(); },
  clearQuery: function () { S.query = ''; render(); },
  openTask: function (a) { S.open = a; S.notice = null; render(); },
  year: function (a) { S.overlay = 'year'; S.yearPick = a; render(); },
  yearPick: function (a) { S.yearPick = a; render(); },
  round: function (a) { S.pastRound = a; render(); },
  openPast: function (a) { var p = a.split('|'), r = ROUNDS.filter(function (x) { return x.id === p[0]; })[0], f = r.files[+p[1]]; say(r.label + ' ' + f[0] + '.' + f[1] + ' 열기 — 목업이라 파일을 열지 않았습니다.'); },
  msg: function (a) { say(MSG[a]); },
  copyName: function (a) { var d = SUBS.filter(function (x) { return x.id === a; })[0]; say('‘' + d.label + '’ 이름 복사 — 실제 클립보드에는 복사하지 않았습니다.'); },
  toggleLink: function (a) {
    var was = !!S.linked[a]; S.linked[a] = !was;
    say(was ? '연결 표시를 해제했습니다. 실제 파일은 그대로입니다.' : '파일 선택 창 대신 예시 파일을 연결 상태로 표시했습니다. 외부 제출 완료가 아닙니다.');
  },
  status: function (a) {
    S.status[S.open] = a;
    if (a === '완료') say('완료로 표시하면 실제 프로그램에서는 완료 폴더로 옮깁니다. 목업이라 폴더를 옮기지 않았습니다.'); else { S.notice = null; render(); }
  },
  repeat: function (a) { S.newRepeat = a; render(); },
  create: function () { S.overlay = null; say('폴더 만들기 — 목업이라 실제 폴더와 파일을 만들거나 복사하지 않았습니다.'); },
  period: function (a) { S.period = a; render(); },
  group: function (a) { S.group = a; render(); },
  selDone: function (a) { S.sel = a; render(); },
  openResult: function (a) { var d = DONE.filter(function (x) { return x.id === S.sel; })[0]; say(d.results[+a] + ' 열기 — 목업이라 파일을 열지 않았습니다.'); },
  copyList: function () {
    var pd = PERIODS.filter(function (p) { return p[0] === S.period; })[0] || PERIODS[4];
    var q = S.dq.trim().toLowerCase();
    var n = DONE.filter(function (d) { return pd[2](d) && (!q || [d.folder, d.what, d.who].some(function (x) { return x.toLowerCase().indexOf(q) !== -1; })); }).length;
    say(pd[1] + ' 완료 작업 ' + n + '건을 “완료일 폴더명 — 요청 내용” 한 줄씩 복사하는 자리입니다. 실제 클립보드에는 복사하지 않았습니다.');
  }
};

/* ---------- 렌더 ---------- */
var app = document.getElementById('app');
function view() {
  return '<div class="scene" style="--pad:' + (S.compact ? '7px 12px' : '11px 14px') + '">' +
    (S.screen === 'main' ? vMain() : vDone()) + vTaskbar() +
    (S.screen === 'main' ? vOverlay() : '') + vToast() + vOpts() + '</div>';
}
function render() {
  var oldRecord = document.querySelector('.record-scroll'), oldSide = document.querySelector('.detail-sidebar');
  var recordTop = oldRecord ? oldRecord.scrollTop : 0, recordLeft = oldRecord ? oldRecord.scrollLeft : 0, sideTop = oldSide ? oldSide.scrollTop : 0;
  var oldRecordTask = oldRecord && oldRecord.getAttribute('data-task');
  var a = document.activeElement, id = a && a.id, pos = null;
  try { if (a && a.selectionStart != null) pos = [a.selectionStart, a.selectionEnd]; } catch (e) { pos = null; }
  app.innerHTML = view();
  document.body.classList.toggle('detail-is-max', !!(S.detailMax && S.screen === 'main' && S.open));
  var recordArea = document.querySelector('.record-scroll'), sideArea = document.querySelector('.detail-sidebar');
  if(recordArea){ recordArea.setAttribute('data-task',S.open); if(oldRecordTask===S.open){recordArea.scrollTop=recordTop;recordArea.scrollLeft=recordLeft; if(sideArea)sideArea.scrollTop=sideTop;} }
  updateRecordCapacity();
  if (id) {
    var n = document.getElementById(id);
    if (n) { n.focus(); if (pos) { try { n.setSelectionRange(pos[0], pos[1]); } catch (e) {} } }
  }
}
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.tagName === 'A') e.preventDefault();
  var f = ACT[el.getAttribute('data-act')];
  if (f) f(el.getAttribute('data-arg'));
});
document.addEventListener('input', function (e) {
  var el = e.target, k = el.getAttribute && el.getAttribute('data-input');
  if (!k) return;
  if (k.indexOf('form.') === 0) { S.form[k.slice(5)] = el.value; return; }
  S[k] = el.value;
  if (k === 'newName') S.newRepeat = null;
  render();
});
document.addEventListener('change', function (e) {
  var el = e.target, c = el.getAttribute && el.getAttribute('data-change');
  if (!c) return;
  if (c === 'copy') S.copy[el.getAttribute('data-arg')] = el.checked;
  else if (c === 'mode') S.folderMode = el.getAttribute('data-arg');
  else if (c === 'overload') S.overload = el.checked;
  else if (c === 'compact') S.compact = el.checked;
  else if (c.indexOf('form.') === 0) { S.form[c.slice(5)] = el.value; return; }
  render();
});
document.addEventListener('dblclick', function(e){
  if(e.target.closest('[data-detail-titlebar]') && !e.target.closest('button')) ACT.toggleDetailMax();
});
function updateRecordCapacity(){
  var area=document.querySelector('.record-scroll'),text=document.querySelector('.record-text'),badge=document.getElementById('record-capacity');
  if(!area||!text||!badge)return;
  var style=getComputedStyle(text),available=area.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom);
  var lines=Math.max(1,Math.floor(available/parseFloat(style.lineHeight)));
  badge.textContent='현재 화면 약 '+lines+'줄';
}
window.addEventListener('resize',updateRecordCapacity);
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && S.overlay) { S.overlay = null; render(); }
  else if(e.key === 'Escape' && S.detailMax){S.detailMax=false;render();}
});
render();
})();
</script>
</body>
</html>
